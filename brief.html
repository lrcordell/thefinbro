<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Morning Brief — Copy for Beehiiv</title>
<meta name="robots" content="noindex">
<style>
  body{font-family:sans-serif;max-width:650px;margin:40px auto;padding:0 20px;background:#0a0a0a;color:#eee;}
  h1{font-size:22px;}
  .meta{color:#999;font-size:13px;margin-bottom:24px;}
  .article{margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid #333;}
  .tkr{font-family:monospace;font-size:12px;color:#999;}
  .article h3{margin:6px 0;}
  .article p{color:#ccc;line-height:1.5;}
  #copyBtn{background:#ff5a1f;color:#000;border:none;padding:12px 24px;font-weight:700;border-radius:6px;cursor:pointer;font-size:15px;}
  #status{margin-left:12px;color:#4ade80;font-size:14px;}
  #preview{background:#111;padding:20px;border-radius:8px;margin-top:24px;}
</style>
</head>
<body>
  <h1>Morning Brief — Copy &amp; Paste into Beehiiv</h1>
  <p class="meta">Bookmark this page. Each morning: click Copy, open Beehiiv, create a new post, paste, glance it over, hit send.</p>
  <button id="copyBtn">Copy Brief</button>
  <span id="status"></span>
  <div id="preview">Loading today's content...</div>

  <script>
    let articlesHtml = '';
    let titleText = '';

    async function load(){
      try{
        const res = await fetch('/api/fetch-news');
        const data = await res.json();
        const today = new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
        titleText = `Morning Brief — ${today}`;

        articlesHtml = data.news.map(n => `
          <div class="article">
            <div class="tkr">${n.tkr} · ${n.source}</div>
            <h3>${n.locked ? '🔒 ' : ''}${n.title}</h3>
            <p>${n.locked ? 'Full breakdown available to Pro members.' : n.body}</p>
          </div>
        `).join('');

        document.getElementById('preview').innerHTML = `<h2>${titleText}</h2>` + articlesHtml;
      }catch(err){
        document.getElementById('preview').textContent = 'Could not load today\'s content — try refreshing.';
      }
    }
    load();

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const fullHtml = `<h1>${titleText}</h1>` + articlesHtml;
      const plainText = document.getElementById('preview').innerText;
      try{
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/html': new Blob([fullHtml], { type: 'text/html' }),
            'text/plain': new Blob([plainText], { type: 'text/plain' }),
          })
        ]);
        document.getElementById('status').textContent = '✓ Copied! Paste into Beehiiv now.';
      }catch(err){
        document.getElementById('status').textContent = 'Copy failed — try selecting the text manually and copying instead.';
      }
    });
  </script>
</body>
</html>
